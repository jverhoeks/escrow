# Keeps SHA-pinned GitHub Actions current. Dependabot understands commit-SHA
# pins: it bumps both the SHA and the trailing `# vX.Y.Z` comment, so pinning
# for supply-chain safety does not mean missing upstream security patches.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows/* and the composite action manifests
    # (action.yml, .github/actions/setup-escrow/action.yml).
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR per week for routine action bumps instead of many.
      actions:
        patterns:
          - "*"
