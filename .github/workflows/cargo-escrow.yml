# Validates Renovate (and human) cargo dependency updates through escrow
# before they can be merged. Blocks if any new dependency fails the age gate
# or has a known CVE at or above the configured severity.
name: cargo escrow check

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'

# Least privilege: build/test only need to read the repo. No write scope is
# granted to GITHUB_TOKEN, limiting blast radius if an action is compromised.
permissions:
  contents: read

jobs:
  cargo-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: jverhoeks/escrow@v1
        with:
          ecosystems: 'cargo'
          min-days: '7'         # block packages < 7 days old
          osv-severity: 'HIGH'  # block HIGH + CRITICAL CVEs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # cargo build routes through escrow via the ~/.cargo/config.toml
      # written by the action. Any blocked crate fails the build.
      - name: Build (escrow-gated)
        run: cargo build --locked

      - name: Test (escrow-gated)
        run: cargo test --locked
