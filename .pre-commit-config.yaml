# Pre-commit hooks for the escrow repo.
#
# Setup once per clone:   pre-commit install
# Run on demand:          pre-commit run --all-files
# Bump hook versions:     pre-commit autoupdate
#
# `actionlint` lints GitHub Actions workflows (catches the kind of issues we
# hit: bad expressions, deprecated runtimes, shell quoting). Its hook builds
# actionlint with Go, so `go` must be on PATH when committing workflow changes.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Only lint actual workflow files, not composite-action manifests.
        files: ^\.github/workflows/.*\.ya?ml$

  # go vet as a local hook (uses the toolchain on PATH). (#85)
  # NOTE: gofmt is intentionally NOT added here — the tree currently uses a
  # non-gofmt import grouping, so a gofmt hook would block every commit until a
  # separate repo-wide reformat is done.
  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: bash -c 'go vet ./...'
        language: system
        types: [go]
        pass_filenames: false
